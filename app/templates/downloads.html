{% extends "base.html" %}
{% block title %}Скачать — hoshi2space{% endblock %}
{% block content %}
<h2>Скачать</h2>

{% if not items %}
<p>Раздел пока в разработке — загляните позже.</p>
{% endif %}

{% for item in items %}
<div class="db-card">
    <h3>{{ item.title }}</h3>
    <p style="white-space: pre-wrap;">{{ item.description }}</p>
    <a href="{{ item.download_url }}" class="cta" target="_blank" rel="noopener">Скачать</a>
</div>
{% endfor %}
{% endblock %}
