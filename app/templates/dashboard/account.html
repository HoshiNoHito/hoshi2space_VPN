{% extends "dashboard/base.html" %}
{% block db_content %}
<h2>Аккаунт</h2>

<div class="db-card">
    {% if saved %}<p class="hint-ok">Сохранено</p>{% endif %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post" action="/dashboard/account">
        <label>Цвет аватара</label>
        <div class="avatar-picker">
            {% for color in avatar_colors %}
            <label class="avatar-option">
                <input type="radio" name="avatar_color" value="{{ color }}" {% if user.avatar_color == color %}checked{% endif %}>
                <span class="avatar-swatch" style="background: {{ color }}"></span>
            </label>
            {% endfor %}
        </div>

        <label for="nickname">Никнейм</label>
        <input type="text" id="nickname" name="nickname" value="{{ user.nickname }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" required>

        <label for="phone">Телефон (необязательно)</label>
        <input type="tel" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="+7 900 000-00-00">

        <button type="submit">Сохранить</button>
    </form>
</div>
{% endblock %}
