{% extends "base.html" %}
{% block content %}
<div class="rail-layout">
    <button class="db-mobile-toggle" onclick="document.querySelector('.rail-nav').classList.toggle('open')">☰ Меню</button>

    <nav class="rail-nav">
        <a href="/admin" class="rail-item {{ 'active' if active == 'home' }}">
            <span class="rail-icon" style="transform: rotate(45deg);"></span>
            <span class="rail-label">ОБЗОР</span>
        </a>
        <a href="/admin/users" class="rail-item {{ 'active' if active == 'users' }}">
            <span class="rail-icon" style="border-radius: 50%; width: 10px; height: 10px;"></span>
            <span class="rail-label">ЛЮДИ</span>
        </a>
        <a href="/admin/news" class="rail-item {{ 'active' if active == 'news' }}">
            <span class="rail-icon" style="border-radius: 3px;"></span>
            <span class="rail-label">НОВОСТИ</span>
        </a>
        <a href="/admin/downloads" class="rail-item {{ 'active' if active == 'downloads' }}">
            <span class="rail-icon" style="border-radius: 3px 3px 0 0; border-bottom: none;"></span>
            <span class="rail-label">ФАЙЛЫ</span>
        </a>
        <a href="/admin/faq" class="rail-item {{ 'active' if active == 'faq' }}">
            <span class="rail-icon" style="border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px;">?</span>
            <span class="rail-label">FAQ</span>
        </a>
    </nav>

    <section class="rail-content">
        {% block admin_content %}{% endblock %}
    </section>
</div>
{% endblock %}
