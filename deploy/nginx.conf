# /etc/nginx/sites-available/hoshi2space.ru
# Разместить сайт на отдельном порту (uvicorn слушает 127.0.0.1:8000),
# 3x-ui панель остаётся на своём порту (например 2053) и не пересекается с сайтом.

server {
    listen 80;
    server_name hoshi2space.ru www.hoshi2space.ru;

    # Редирект на HTTPS после того как получишь сертификат (certbot --nginx)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/deploy/vpn-site/app/static/;
        expires 7d;
    }
}
